name: CI-CD Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: foodgram-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE: foodgram-backend:latest

jobs:
  lint_and_tests:
    runs-on: ubuntu-latest
    env:
      USE_SQLITE_FOR_TESTS: "1"

    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Проверить линтером
        run: ruff check backend

      - name: Запустить тесты
        run: pytest --tb=short -q

  build_and_save_backend_image:
    needs: lint_and_tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Собрать backend image
        run: |
          docker build -t "${{ env.BACKEND_IMAGE }}" -f backend/Dockerfile .

      - name: Сохранить образ в tar-архив
        run: |
          docker save "${{ env.BACKEND_IMAGE }}" -o foodgram-backend.tar

      - name: Сохранить tar-архив как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: foodgram-backend-tar
          path: foodgram-backend.tar
          if-no-files-found: error

  deploy_to_vm:
    needs: build_and_save_backend_image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Скачать артефакт с образом
        uses: actions/download-artifact@v4
        with:
          name: foodgram-backend-tar
          path: .

      - name: Подготовить SSH ключ
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/deploy_key <<'EOF'
          ${{ secrets.SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT || '22' }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Создать директорию деплоя на сервере
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.SSH_PORT || '22' }}" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ secrets.PROJECT_DIR }}/infra'"

      - name: Скопировать конфиги на сервер
        shell: bash
        run: |
          scp -i ~/.ssh/deploy_key \
            -P "${{ secrets.SSH_PORT || '22' }}" \
            -o StrictHostKeyChecking=yes \
            infra/docker-compose.yml \
            infra/nginx.conf \
            infra/.env.example \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.PROJECT_DIR }}/infra/"

      - name: Скопировать образ на сервер
        shell: bash
        run: |
          scp -i ~/.ssh/deploy_key \
            -P "${{ secrets.SSH_PORT || '22' }}" \
            -o StrictHostKeyChecking=yes \
            foodgram-backend.tar \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.PROJECT_DIR }}/"

      - name: Деплой на ВМ (запуск контейнеров)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            mkdir -p "${{ secrets.PROJECT_DIR }}/infra"
            cd "${{ secrets.PROJECT_DIR }}/infra"
            cp -n .env.example .env || true
            if grep -q '^BACKEND_IMAGE=' .env; then
              sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}|" .env
            else
              echo "BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}" >> .env
            fi

            cd "${{ secrets.PROJECT_DIR }}"
            docker load -i foodgram-backend.tar
            docker compose -f infra/docker-compose.yml down || true
            docker compose -f infra/docker-compose.yml up -d
            docker compose -f infra/docker-compose.yml exec -T backend python manage.py migrate --noinput
            docker compose -f infra/docker-compose.yml ps