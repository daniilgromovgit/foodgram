name: CI-CD Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: foodgram-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/foodgram-backend

jobs:
  lint_and_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Проверить линтером
        run: ruff check backend

      - name: Запустить тесты
        run: pytest --tb=short -q

  build_and_push_backend_image:
    needs: lint_and_tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Войти в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Собрать и отправить backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  deploy_to_vm:
    needs: build_and_push_backend_image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Деплой на ВМ
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            cd ${{ secrets.PROJECT_DIR }}
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            cd infra
            cp -n .env.example .env || true
            if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            fi
            if grep -q '^BACKEND_IMAGE=' .env; then
              sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:latest|" .env
            else
              echo "BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:latest" >> .env
            fi
            docker compose pull backend
            docker compose down
            docker compose up -d
            docker compose exec -T backend python manage.py migrate --noinput

            if [ -n "${{ secrets.ADMIN_USERNAME }}" ] && [ -n "${{ secrets.ADMIN_EMAIL }}" ] && [ -n "${{ secrets.ADMIN_PASSWORD }}" ]; then
              docker compose exec -T \
                -e ADMIN_USERNAME="${{ secrets.ADMIN_USERNAME }}" \
                -e ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}" \
                -e ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
                backend python manage.py shell -c "import os; from django.contrib.auth import get_user_model; U=get_user_model(); username=os.environ['ADMIN_USERNAME']; email=os.environ['ADMIN_EMAIL']; password=os.environ['ADMIN_PASSWORD']; existing = U.objects.filter(username=username).first() or U.objects.filter(email=email).first(); created = existing is None; user = existing or U(username=username, email=email); user.username=username; user.email=email; user.is_staff=True; user.is_superuser=True; user.set_password(password); user.save(); print('admin ensured:', username, 'created=' + str(created))"
            else
              echo "ADMIN secrets are not set; skipping admin bootstrap"
            fi
            docker compose ps