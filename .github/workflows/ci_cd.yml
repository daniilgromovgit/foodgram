name: CI-CD Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: foodgram-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE: foodgram-backend:latest

jobs:
  lint_and_tests:
    runs-on: ubuntu-latest
    env:
      USE_SQLITE_FOR_TESTS: "1"

    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Проверить линтером
        run: ruff check backend

      - name: Запустить тесты
        run: pytest --tb=short -q

  build_and_save_backend_image:
    needs: lint_and_tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Собрать backend image
        run: |
          docker build -t "${{ env.BACKEND_IMAGE }}" -f backend/Dockerfile .

      - name: Сохранить образ в tar-архив
        run: |
          docker save "${{ env.BACKEND_IMAGE }}" -o foodgram-backend.tar

      - name: Сохранить tar-архив как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: foodgram-backend-tar
          path: foodgram-backend.tar
          if-no-files-found: error

  deploy_to_vm:
    needs: build_and_save_backend_image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Скачать артефакт с образом
        uses: actions/download-artifact@v4
        with:
          name: foodgram-backend-tar
          path: .

      - name: Подготовить SSH ключ
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/deploy_key <<'EOF'
          ${{ secrets.SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT || '22' }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Создать директорию деплоя на сервере
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.SSH_PORT || '22' }}" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ secrets.PROJECT_DIR }}/infra'"

      - name: Скопировать конфиги на сервер
        shell: bash
        run: |
          scp -i ~/.ssh/deploy_key \
            -P "${{ secrets.SSH_PORT || '22' }}" \
            -o StrictHostKeyChecking=yes \
            infra/docker-compose.yml \
            infra/nginx.conf \
            infra/.env.example \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.PROJECT_DIR }}/infra/"

      - name: Скопировать образ на сервер
        shell: bash
        run: |
          scp -i ~/.ssh/deploy_key \
            -P "${{ secrets.SSH_PORT || '22' }}" \
            -o StrictHostKeyChecking=yes \
            foodgram-backend.tar \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.PROJECT_DIR }}/"

      - name: Деплой на ВМ (запуск контейнеров)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e

            # Bootstrap Docker on Ubuntu VMs when the engine or Compose plugin is missing.
            if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
              if [ ! -r /etc/os-release ]; then
                echo "Cannot detect the server OS; install Docker Engine and the Compose plugin manually."
                exit 1
              fi
              . /etc/os-release
              if [ "${ID:-}" != "ubuntu" ]; then
                echo "Automatic Docker installation supports Ubuntu only (detected: ${ID:-unknown})."
                exit 1
              fi

              if [ "$(id -u)" -ne 0 ] && { ! command -v sudo >/dev/null 2>&1 || ! sudo -n true >/dev/null 2>&1; }; then
                echo "Docker is missing. Configure passwordless sudo for ${USER}, then rerun the deployment."
                exit 1
              fi

              run_privileged() {
                if [ "$(id -u)" -eq 0 ]; then
                  "$@"
                else
                  sudo -n "$@"
                fi
              }

              run_privileged apt-get update
              run_privileged env DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose-v2
              run_privileged systemctl enable --now docker
            fi

            if docker info >/dev/null 2>&1; then
              DOCKER_USE_SUDO=0
            elif command -v sudo >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
              DOCKER_USE_SUDO=1
            else
              echo "Docker is installed, but ${USER} cannot access the Docker daemon (and passwordless sudo is unavailable)."
              exit 1
            fi

            docker_cmd() {
              if [ "$DOCKER_USE_SUDO" = "1" ]; then
                sudo -n docker "$@"
              else
                docker "$@"
              fi
            }

            mkdir -p "${{ secrets.PROJECT_DIR }}/infra"
            cd "${{ secrets.PROJECT_DIR }}/infra"
            cp -n .env.example .env || true
            if grep -q '^BACKEND_IMAGE=' .env; then
              sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}|" .env
            else
              echo "BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}" >> .env
            fi

            cd "${{ secrets.PROJECT_DIR }}"
            docker_cmd load -i foodgram-backend.tar
            docker_cmd compose -f infra/docker-compose.yml down || true
            docker_cmd compose -f infra/docker-compose.yml up -d
            docker_cmd compose -f infra/docker-compose.yml exec -T backend python manage.py migrate --noinput
            docker_cmd compose -f infra/docker-compose.yml exec -T backend python manage.py prepare_review_data
            docker_cmd compose -f infra/docker-compose.yml ps
            docker_cmd compose -f infra/docker-compose.yml logs --tail=50 backend