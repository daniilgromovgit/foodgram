name: foodgram

volumes:
  pg_data:
  static_data:
  media_data:
  frontend_data:
  caddy_data:
  caddy_config:

services:
  db:
    image: postgres:16-alpine
    container_name: foodgram-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-foodgram_user} -d ${POSTGRES_DB:-foodgram}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-docker.io/library/foodgram-backend:latest}
    container_name: foodgram-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - static_data:/app/backend/static
      - media_data:/app/backend/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ../frontend
    container_name: foodgram-front-build
    volumes:
      - frontend_data:/app/result_build/

  proxy:
    image: caddy:2-alpine
    container_name: foodgram-proxy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-foddygramm.duckdns.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_data:/srv/frontend:ro
      - static_data:/srv/backend_static:ro
      - media_data:/srv/media:ro
      - ../docs/:/srv/docs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
